name: Build
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"  # nightly run of the whole test suite
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: |
          sudo apt-get install python3-pip
          pip3 install flake8 --break-system-packages
          flake8 --ignore=W503 --max-line-length=100

  conda-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: true
      - name: Build
        shell: bash -l {0}
        run: |
          conda install -y scikit-learn pytest pytest-xdist pytest-timeout networkx matplotlib-base pip sphinx numpydoc pytest-cov codecov tensorflow
          pip install .
          make html -C doc
          # fast tests only (slow ones excluded by default, see pyproject.toml)
          mv tensap tensap_code && pytest -n auto --cov-report=xml --cov=tensap test && codecov && mv tensap_code tensap
      - name: Upload
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          exit 0
          git clone --depth 1 https://${{ secrets.GH_TOKEN }}@github.com/anthony-nouy/anthony-nouy.github.io.git /tmp/io
          mkdir -p /tmp/io/sphinx/tensap/master
          cp -r doc/_build/html/* /tmp/io/sphinx/tensap/master
          cd /tmp/io
          touch .nojekyll
          git config user.email "support@gh.com"
          git config user.name "GitHub Actions"
          git add -A .
          if test `git diff HEAD | wc -c` -eq 0; then exit 0; fi
          git commit -a -m "GitHub Actions build ${GITHUB_REPOSITORY} ${GITHUB_RUN_ID}"
          git push --quiet origin master > /dev/null 2>&1

  # Fast suite on Linux and macOS, with an old and a recent numpy: numerical
  # results may depend on the numpy version (see test_suite.tex).
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        include:
          - python: "3.10"
            numpy: "1.26"
          - python: "3.13"
            numpy: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: true
          python-version: ${{ matrix.python }}
      - name: Test
        shell: bash -l {0}
        run: |
          conda install -y "numpy=${{ matrix.numpy }}" scipy networkx scikit-learn matplotlib-base pytest pytest-xdist pytest-timeout pip
          pip install .
          mv tensap tensap_code && pytest -n auto test && mv tensap_code tensap

  # Optional dependencies (PyTorch, pymanopt) in the pinned test environment,
  # with the coverage of the branches (threshold in pyproject.toml).
  optional-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: true
          environment-file: environment-test.yml
          activate-environment: tensap-test
      - name: Test
        shell: bash -l {0}
        run: |
          pip install .
          mv tensap tensap_code && pytest -n auto --cov=tensap test && mv tensap_code tensap

  conda-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: true
      - name: Build
        run: |
          conda install -y scikit-learn pytest pytest-xdist pytest-timeout networkx matplotlib-base pip python=3.13
          pip install tensorflow
          pip install .
          pytest -n auto

  # Whole test suite, slow tests included: pull requests, nightly, on demand.
  conda-linux-full:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          conda-remove-defaults: true
      - name: Test
        shell: bash -l {0}
        run: |
          conda install -y scikit-learn pytest pytest-xdist pytest-timeout networkx matplotlib-base pip tensorflow
          pip install .
          mv tensap tensap_code && pytest -n auto -m "" test && mv tensap_code tensap
