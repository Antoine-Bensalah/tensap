name: Documentation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[doc]"
      # Outputs of the gallery examples. sphinx-gallery does not run again an
      # example whose script has not changed since the cached run. The key
      # holds the package sources first: when tensap changes, every example
      # runs again; when only examples change, only those run again.
      - uses: actions/cache@v4
        with:
          path: |
            doc/examples
          key: gallery-${{ hashFiles('tensap/**', 'pyproject.toml') }}-${{ hashFiles('examples/**') }}
          restore-keys: |
            gallery-${{ hashFiles('tensap/**', 'pyproject.toml') }}-
      - name: Build (warnings are errors)
        run: make html -C doc
