name: Documentation
# The documentation runs every example, which takes a long time when tensap
# changes (the cache of the gallery is then invalid). It is therefore built
# on demand only: by "Run workflow" in the Actions tab, on a push whose
# commit message contains "[docs]", and on pull requests.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[docs]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[doc]"
      # Outputs of the gallery examples. sphinx-gallery does not run again an
      # example whose script has not changed since the cached run. The key
      # holds the package sources first: when tensap changes, every example
      # runs again; when only examples change, only those run again.
      - uses: actions/cache@v4
        with:
          path: |
            doc/examples
            doc/use_cases
            doc/tutorials
          key: gallery-${{ hashFiles('tensap/**', 'pyproject.toml') }}-${{ hashFiles('examples/**', 'use_cases/**', 'test/non_regression_scripts/**') }}
          restore-keys: |
            gallery-${{ hashFiles('tensap/**', 'pyproject.toml') }}-
      - name: Build (warnings are errors)
        run: make html -C doc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/_build/html

  # Publication on the GitHub Pages of the fork only, from the branch
  # ab/site. Anthony's site is not touched.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'Antoine-Bensalah/tensap' && github.ref == 'refs/heads/ab/site'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
